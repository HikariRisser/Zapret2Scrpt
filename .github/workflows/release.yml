# Выпуск релиза при слиянии в main.
#
# Релиз создаётся, когда одновременно:
#   * в zapret2-linux.sh стоит версия, для которой релиза ещё нет;
#   * есть файл release-notes/<версия>.md с описанием.
# Тег равен номеру версии. К релизу прикладываются zapret2-linux.sh,
# Zapret2Windows.cmd и Zapret2Windows.ps1, в описание дописываются их SHA-256.
name: Release

on:
  push:
    branches: [main]
    paths:
      - zapret2-linux.sh
      - Zapret2Windows.ps1
      - Zapret2Windows.cmd
      - release-notes/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pin по хешу коммита (F-23), не по метке: метка может быть передвинута.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Определить версию
        id: ver
        run: |
          linux=$(sed -n 's/^VERSION = "\([0-9][0-9A-Za-z.-]*\)"$/\1/p' zapret2-linux.sh | head -n 1)
          windows=$(grep -o "ScriptVersion='[^']*'" Zapret2Windows.ps1 | head -n 1 | cut -d"'" -f2)
          if [ -z "$linux" ]; then
            echo "::error::Не найдена версия в zapret2-linux.sh"
            exit 1
          fi
          if [ "$linux" != "$windows" ]; then
            # Релиз с расхождением версий нельзя: апдейтер Windows-скрипта
            # сравнивает версии и будет вечно предлагать «обновление».
            echo "::error::Версии различаются: Linux $linux, Windows $windows. Выровняйте версии в обоих скриптах."
            exit 1
          fi
          echo "version=$linux" >> "$GITHUB_OUTPUT"
          echo "Версия: $linux"

      - name: Проверить файлы
        run: |
          python3 -m py_compile zapret2-linux.sh
          python3 tools/build-cmd.py --check

      - name: Нужен ли релиз
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Релиз $VERSION уже есть - пропуск."
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "release-notes/$VERSION.md" ]; then
            echo "::notice::Нет release-notes/$VERSION.md - релиз $VERSION не создаётся."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Создать релиз
        if: steps.need.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cp "release-notes/$VERSION.md" notes.md
          {
            echo
            echo "### Контрольные суммы (SHA-256)"
            echo
            echo '```'
            sha256sum zapret2-linux.sh Zapret2Windows.cmd Zapret2Windows.ps1
            echo '```'
          } >> notes.md
          sha256sum zapret2-linux.sh Zapret2Windows.cmd Zapret2Windows.ps1 > SHA256SUMS
          gh release create "$VERSION" \
            zapret2-linux.sh Zapret2Windows.cmd Zapret2Windows.ps1 SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Zapret2 Windows / Linux $VERSION" \
            --notes-file notes.md
